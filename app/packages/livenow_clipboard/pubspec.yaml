name: livenow_clipboard
description: Reads ALL images on the iOS clipboard (pasteboard returns only one).
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LivenowClipboardPlugin
