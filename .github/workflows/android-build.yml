# Builds a signed Android APK (livenow.apk) on a GitHub Linux runner, so no
# Android SDK is needed on your own PC. Copy the .apk to the phone (or
# `adb install livenow.apk`) and allow "install unknown apps".
#
# Signing: the release key comes from the repository secrets
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD and
# ANDROID_KEY_ALIAS. Without them the build falls back to the debug key.
#
# Runs ONLY when you ask: push a tag that starts with "android-" (git tag
# android-1 && git push origin android-1) or press "Run workflow" on the Actions
# page.
name: Android build (signed APK)

on:
  push:
    tags: ['android-*']
  workflow_dispatch:

# The job only reads the repository: the token gets nothing else.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      # Actions are pinned to a commit (the comment names the tag it was taken
      # from), so a moved or hijacked tag cannot change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Static analysis
        run: flutter analyze lib

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets: building with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.p12
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=app/release.p12"
          } > android/key.properties

      - name: Build (release)
        run: flutter build apk --release

      - name: Show who signed it
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -4

      - name: Name the file
        run: cp build/app/outputs/flutter-apk/app-release.apk livenow.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: livenow-android-apk
          path: app/livenow.apk
          retention-days: 7
