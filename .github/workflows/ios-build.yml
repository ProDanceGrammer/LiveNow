# Builds an UNSIGNED iOS app (.ipa) on a GitHub macOS runner, so no Mac of your
# own is needed. Sign + install it from Windows with Sideloadly / AltStore (free
# Apple ID, valid 7 days).
#
# Runs ONLY when you ask: push a tag that starts with "ios-" (git tag ios-1 &&
# git push origin ios-1) or press "Run workflow" on the Actions page. A build
# costs ~10-15 macOS minutes (a private repo's free quota counts macOS x10).
name: iOS build (unsigned)

on:
  push:
    tags: ['ios-*']
  workflow_dispatch:

# The job only reads the repository: the token gets nothing else.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      # Actions are pinned to a commit (the comment names the tag it was taken
      # from), so a moved or hijacked tag cannot change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Plugins such as device_info_plus need a recent iOS SDK: use the newest
      # Xcode the runner image has installed.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode_*.app
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      # The repository has no ios/ folder (the app was Windows-first): generate
      # it here. Existing lib/ and test/ files are left alone.
      - name: Generate the iOS project
        run: flutter create --platforms=ios --org io.livenow --project-name livenow .

      - name: Permissions and network settings (Info.plist)
        run: |
          PLIST=ios/Runner/Info.plist
          B=/usr/libexec/PlistBuddy
          $B -c "Add :NSLocalNetworkUsageDescription string 'LiveNow syncs with your PC over your home network.'" $PLIST
          $B -c "Add :NSCameraUsageDescription string 'LiveNow scans the pairing code shown on your PC.'" $PLIST
          $B -c "Add :NSPhotoLibraryUsageDescription string 'LiveNow uses a picture from your photos as an account icon.'" $PLIST
          # The sync traffic is plain HTTP but encrypted by the app itself; it
          # goes to the paired PC: a LAN address, or a Tailscale 100.x one (an
          # IP address literal). NSAllowsLocalNetworking allows cleartext to
          # IP literals, .local and unqualified names ONLY, while ATS stays on
          # for everything else (links, images): no NSAllowsArbitraryLoads.
          $B -c "Add :NSAppTransportSecurity dict" $PLIST
          $B -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" $PLIST

      # flutter_local_notifications does NOT set itself as the notification
      # centre's delegate on iOS: without this line a tap on a reminder never
      # reaches the app (and foreground notifications stay hidden).
      - name: Notification delegate (AppDelegate)
        run: |
          F=ios/Runner/AppDelegate.swift
          sed -i '' '/return super.application(application, didFinishLaunchingWithOptions: launchOptions)/i\
          UNUserNotificationCenter.current().delegate = self as? UNUserNotificationCenterDelegate
          ' $F
          grep -q "UNUserNotificationCenter.current().delegate" $F || { echo "AppDelegate not patched"; cat $F; exit 1; }
          cat $F

      # mobile_scanner needs iOS 15.5+.
      - name: Raise the deployment target
        run: |
          sed -i '' "s/^# platform :ios.*/platform :ios, '15.5'/" ios/Podfile
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.5/g' ios/Runner.xcodeproj/project.pbxproj

      - run: flutter pub get

      # The app icon (Urgency flame + scales on light violet) replaces the
      # default Flutter icon of the generated ios/ project.
      - name: App icon
        run: dart run flutter_launcher_icons -f icons_ios.yaml

      - name: Build (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Pack the .ipa
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry livenow.ipa Payload

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: livenow-ios-unsigned
          path: app/livenow.ipa
          retention-days: 7
